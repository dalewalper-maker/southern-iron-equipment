<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="Southern Iron Equipment">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5b842"/>
      <stop offset="55%" stop-color="#f0a81e"/>
      <stop offset="100%" stop-color="#c98a16"/>
    </linearGradient>
  </defs>
  <!-- Hexagon plate -->
  <polygon points="240,32 432,142 432,338 240,448 48,338 48,142"
           fill="#0d0d0f" stroke="url(#gold)" stroke-width="14" stroke-linejoin="miter"/>
  <!-- Inner accent stripe -->
  <polygon points="240,64 410,160 410,320 240,416 70,320 70,160"
           fill="none" stroke="#f0a81e" stroke-width="2" opacity="0.35"/>
  <!-- SI monogram -->
  <text x="240" y="252" font-family="Arial Black, 'Helvetica Neue', sans-serif"
        font-size="190" font-weight="900" fill="url(#gold)"
        text-anchor="middle" letter-spacing="-10">SI</text>
  <!-- Wordmark -->
  <text x="240" y="332" font-family="Arial, 'Helvetica Neue', sans-serif"
        font-size="34" font-weight="800" fill="#f0a81e"
        text-anchor="middle" letter-spacing="6">SOUTHERN IRON</text>
  <text x="240" y="370" font-family="Arial, 'Helvetica Neue', sans-serif"
        font-size="20" font-weight="500" fill="#a3a3ad"
        text-anchor="middle" letter-spacing="10">EQUIPMENT</text>
  <!-- Subtle base bar like industrial nameplate -->
  <rect x="120" y="394" width="240" height="3" fill="#f0a81e" opacity="0.45"/>
</svg>
