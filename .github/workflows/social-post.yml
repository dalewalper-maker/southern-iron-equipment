name: Meta auto-post (FB Page + Instagram)

on:
  schedule:
    - cron: '0 15,18,21,23 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Post to FB Page and Instagram
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_ENABLED: "1"
          PUBLIC_BASE: "https://cdn.jsdelivr.net/gh/dalewalper-maker/southern-iron-equipment@main"
        continue-on-error: true
        run: python post_to_meta.py
      - name: Commit log + queue
        if: always()
        run: |
          git config user.name "Southern Iron Bot"
          git config user.email "actions@users.noreply.github.com"
          git add post_log.txt social_queue.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "meta-post log + queue [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break || sleep $i
          done
