name: Meta auto-post (FB Page + Instagram)

on:
  schedule:
    - cron: '0 15,18,21,23 * * 1-5'
  workflow_dispatch:
  push:
    paths:
      - '.trigger-post'
      - 'post_to_meta.py'

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test commit-back
        run: |
          echo "Workflow ran at $(date -u) via ${{ github.event_name }}" > workflow-ran.txt
          git config user.name "Southern Iron Bot"
          git config user.email "actions@users.noreply.github.com"
          git add workflow-ran.txt
          git commit -m "test: workflow ran [skip ci]"
          git push
      - name: Post to FB + IG
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_ENABLED: "1"
        run: |
          set +e
          python post_to_meta.py > post_log.tx