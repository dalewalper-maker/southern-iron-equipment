name: Meta auto-post (FB Page + Instagram)

on:
  schedule:
    - cron: '0 15,18,21,23 * * 1-5'
  workflow_dispatch:
  push:
    paths:
      - '.trigger-post'
      - 'post_to_meta.py'

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Diagnose environment
        run: |
          {
            echo "=== Workflow run debug ==="
            echo "Date UTC: $(date -u)"
            echo "Trigger: ${{ github.event_name }}"
            echo "SHA: ${{ github.sha }}"
            echo ""
            echo "=== Tools ==="
            echo "python: $(which python || echo MISSING)"
            echo "python3: $(which python3 || echo MISSING)"
            echo "python version: $(python --version 2>&1)"
            echo ""
            echo "=== Files ==="
            ls -la post_to_meta.py social_queue.json 2>&1
            echo ""
       