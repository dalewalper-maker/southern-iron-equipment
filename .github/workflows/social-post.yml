name: Meta auto-post (FB Page + Instagram)

on:
  schedule:
    - cron: '0 15,18,21,23 * * 1-5'
  workflow_dispatch:
  push:
    paths:
      - '.trigger-post'
      - 'post_to_meta.py'

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    concurrency:
      group: meta-post-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Mark run started
        run: |
          mkdir -p .runs
          echo "Started $(date -u +%FT%TZ) trigger=${{ github.event_name }}" > .runs/last-run.txt
      - name: Post to FB Page + IG
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID:    ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID:    ${{ secrets.IG_USER_ID }}
          IG_ENABLED:    "1"
        run: |
          set +e
          python post_to_meta.py 2>&1 | tee post_log.txt
          rc=${PIPESTATUS[0]}
          ec